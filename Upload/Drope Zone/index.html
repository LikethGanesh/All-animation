<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dropzone</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- CURSOR LIGHT SPOTLIGHT -->
  <div id="cursorLight" class="cursor-light"></div>

  <div class="main-container">
    <div id="mainCard" class="dropzone-card">
      <div class="card-intro">
        <h2 class="card-title">Upload files</h2>
        <p class="card-subtitle">PNG, JPG, WebP, GIF or PDF · up to 8 MB each · 6 files max</p>
      </div>

      <!-- Dropzone Area -->
      <div id="dropzone" class="drop-area">
        <input type="file" id="fileInput" multiple accept="image/png, image/jpeg, image/webp, image/gif, application/pdf" hidden>
        
        <div class="drop-content">
          <div class="upload-icon-wrapper">
            <div class="tiny-file tiny-file-left"></div>
            <div class="tiny-file tiny-file-right"></div>
            <svg class="upload-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="17 8 12 3 7 8"></polyline>
              <line x1="12" y1="3" x2="12" y2="15"></line>
            </svg>
          </div>
          <div class="drop-text-group">
            <span class="drop-primary-text">Drop files here</span>
            <span class="drop-secondary-text">or <button type="button" id="browseBtn" class="browse-link">browse</button> · you can paste too</span>
          </div>
        </div>
      </div>

      <!-- Dynamic File List -->
      <div id="fileList" class="file-list"></div>

      <!-- Summary & Clear Bar -->
      <div id="summaryBar" class="summary-bar" style="display: none;">
        <div class="summary-info">
          <div class="summary-icon-wrapper">
            <svg id="summaryRingSvg" class="summary-progress-svg" viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="10" class="ring-bg"></circle>
              <circle id="summaryRingFill" cx="12" cy="12" r="10" class="ring-fill" stroke-dasharray="62.83" stroke-dashoffset="62.83"></circle>
            </svg>
            <svg id="summaryCheckSvg" class="summary-check-svg" viewBox="0 0 24 24" style="display: none;">
              <circle cx="12" cy="12" r="10" fill="var(--success)" opacity="0.2"></circle>
              <path d="M7 12.5l3 3 7-7" stroke="var(--success)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"></path>
            </svg>
          </div>
          <span id="summaryCount">0 of 0 uploaded</span>
        </div>
        <button id="clearAllBtn" class="btn-clear">Clear</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
