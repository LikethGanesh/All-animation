<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARC Navigation Dock</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="arc-container">
    <div class="ambient-glow" id="ambientGlow"></div>

    <h1 class="hero-title" id="tabTitle">Broadcast</h1>
    <p class="hero-subtitle" id="tabSubtitle">Tune into live signals, realtime streams and audio pulses.</p>

    <div class="dock-wrapper">
      <nav class="dock" id="dock" role="navigation" aria-label="Main Navigation">
        
        <svg class="dock-rim" aria-hidden="true" preserveAspectRatio="none">
          <defs>
            <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop id="rimStop0" offset="0%" stop-color="rgba(var(--theme-rgb), 0)" />
              <stop id="rimStop1" offset="20%" stop-color="rgba(var(--theme-rgb), 0.7)" />
              <stop id="rimStop2" offset="50%" stop-color="rgba(255, 255, 255, 1)" />
              <stop id="rimStop3" offset="80%" stop-color="rgba(var(--theme-rgb), 0.7)" />
              <stop id="rimStop4" offset="100%" stop-color="rgba(var(--theme-rgb), 0)" />
            </linearGradient>
          </defs>
          <line x1="0" y1="1" x2="100%" y2="1" stroke="url(#rimGrad)" stroke-width="2" />
        </svg>

        <svg class="light" id="lightSvg" aria-hidden="true">
          <defs>
            <filter id="glow-blur" x="-100%" y="-100%" width="300%" height="300%">
              <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur1" />
              <feGaussianBlur in="SourceGraphic" stdDeviation="14" result="blur2" />
              <feMerge>
                <feMergeNode in="blur2" />
                <feMergeNode in="blur1" />
                <feMergeNode in="SourceGraphic" />
              </feMerge>
            </filter>
          </defs>
          <path id="lDiffuse" class="light__diffuse" />
          <path id="lGlow" class="light__glow" />
          <path id="lCore" class="light__core" />
          <path id="lCenter" class="light__center" />
        </svg>

        <div class="tab-list" role="tablist">
          <button class="tab-item" role="tab" aria-selected="false" data-index="0" data-title="Home" data-subtitle="Picked up exactly where you left it.">
            <div class="icon-box">
              <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
              </svg>
            </div>
            <span class="tab-label">Home</span>
          </button>

          <button class="tab-item" role="tab" aria-selected="false" data-index="1" data-title="Search" data-subtitle="Find what you are looking for across the universe.">
            <div class="icon-box">
              <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="7.5"></circle>
                <line x1="21" y1="21" x2="16.5" y2="16.5"></line>
              </svg>
            </div>
            <span class="tab-label">Search</span>
          </button>

          <button class="tab-item active" role="tab" aria-selected="true" data-index="2" data-title="Broadcast" data-subtitle="Tune into live signals, realtime streams and audio pulses.">
            <div class="icon-box">
              <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M5 9a7 7 0 0 1 14 0"></path>
                <path d="M8.5 12.5a3.5 3.5 0 0 1 7 0"></path>
                <circle cx="12" cy="15" r="1.5" fill="currentColor"></circle>
                <line x1="12" y1="16.5" x2="12" y2="21"></line>
              </svg>
            </div>
            <span class="tab-label">Broadcast</span>
          </button>

          <button class="tab-item" role="tab" aria-selected="false" data-index="3" data-title="Library" data-subtitle="All your saved collections, bookmarks, and vaults in one place.">
            <div class="icon-box">
              <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="4" y="3" width="16" height="18" rx="2"></rect>
                <line x1="8" y1="7" x2="16" y2="7"></line>
                <line x1="8" y1="11" x2="16" y2="11"></line>
                <line x1="8" y1="15" x2="12" y2="15"></line>
              </svg>
            </div>
            <span class="tab-label">Library</span>
          </button>

          <button class="tab-item" role="tab" aria-selected="false" data-index="4" data-title="You" data-subtitle="Manage your identity, personal workspace and credentials.">
            <div class="icon-box">
              <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
            </div>
            <span class="tab-label">You</span>
          </button>
        </div>
      </nav>
      
      <p class="interaction-hint">Tap a tab — or drag the light along the bar</p>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
