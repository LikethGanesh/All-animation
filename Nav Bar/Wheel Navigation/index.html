<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wheel Navigation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<section class="ccm-11">
  <div class="ccm-11__stage">
    
    <nav class="ccm-11__machine" style="--n:8">
      <ul class="ccm-11__wheel">
        <li style="--i:0"><button class="ccm-11__stop is-active">Home</button></li>
        <li style="--i:1"><button class="ccm-11__stop">Series</button></li>
        <li style="--i:2"><button class="ccm-11__stop">Films</button></li>
        <li style="--i:3"><button class="ccm-11__stop">Live</button></li>
        <li style="--i:4"><button class="ccm-11__stop">Sports</button></li>
        <li style="--i:5"><button class="ccm-11__stop">Kids</button></li>
        <li style="--i:6"><button class="ccm-11__stop">Music</button></li>
        <li style="--i:7"><button class="ccm-11__stop">My list</button></li>
      </ul>

      <div class="ccm-11__face">
        <em>Now browsing</em>
        <strong class="ccm-11__current">Home</strong>

        <div class="ccm-11__steer">
          <button id="prevBtn">←</button>
          <button id="nextBtn">→</button>
        </div>
      </div>
    </nav>

  </div>
</section>

<script src="script.js"></script>
</body>
</html>
